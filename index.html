<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic AI Tutorial - LangGraph Agent Interface</title>
    <link rel="stylesheet" href="style.css">
    <!-- Markdown parser for rendering LLM responses -->
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.2/marked.min.js"></script>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="header-left">
                <button id="menu-toggle" class="hamburger-menu" aria-label="Open menu">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </button>
                <h1>Agentic AI Tutorial</h1>
            </div>
            <div class="controls">
                <div class="model-selector">
                    <label for="llm-provider">LLM Provider:</label>
                    <select id="llm-provider">
                        <option value="ollama" selected>Ollama (Local)</option>
                        <option value="openai">OpenAI</option>
                    </select>
                </div>
                <div class="model-selector">
                    <label for="model-name">Model:</label>
                    <select id="model-name">
                        <option value="llama3.1:latest" selected>llama3.1:latest</option>
                        <option value="gpt-oss:20b">gpt-oss:20b</option>
                        <option value="deepseek-r1:latest">deepseek-r1:latest</option>
                        <option value="gemma3:latest">gemma3:latest</option>
                        <option value="mistral:latest">mistral:latest</option>
                        <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
                        <option value="gpt-4o">gpt-4o</option>
                        <option value="gpt-4.1">gpt-4.1</option>
                        <option value="gpt-5">gpt-5</option>
                    </select>
                </div>
                <div class="status-indicator">
                    <span id="connection-status" class="status-disconnected">Disconnected</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Slide-out Menu -->
    <div id="slide-menu" class="slide-menu">
        <div class="slide-menu-content">
            <div class="slide-menu-header">
                <h2>Task Configuration</h2>
                <button id="menu-close" class="close-btn" aria-label="Close menu">&times;</button>
            </div>
            
            <!-- Task Input Section -->
            <div class="task-input-section">
                <label for="task-description">Task Description:</label>
                <textarea id="task-description" 
                         placeholder="Enter your task here... (e.g., 'Plan a wedding for 150 people with a $25,000 budget in San Francisco')"
                         rows="4"></textarea>
                <div class="task-controls">
                    <button id="run-task" class="btn-primary" disabled>
                        <span class="btn-text">Run Task</span>
                        <span class="btn-loading" style="display: none;">Running...</span>
                    </button>
                    <button id="pause-task" class="btn-secondary" disabled>Pause Task</button>
                    <button id="clear-task" class="btn-secondary">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Menu Overlay -->
    <div id="menu-overlay" class="menu-overlay"></div>
    
    <div class="container">
        <!-- Main Workflow Area -->
        <div class="workflow-panel">
            <div class="panel-title">
                <h1>Agent Workflow</h1>
            </div>
            <div class="workflow-canvas">
                <svg id="connections-container" class="connections-container"></svg>
                <div id="agents-container" class="agents-grid"></div>
                <div id="tools-container" class="tools-grid"></div>
            </div>
        </div>
        
        <!-- Progress Blackboard Panel -->
        <div class="blackboard-panel">
            <div class="panel-title">
                <h1>Progress Blackboard</h1>
            </div>
            <div class="progress-header">
                <span class="current-agent">Current: <span id="current-agent-name">Ready</span></span>
                <button id="pause-execution" class="btn-secondary btn-small">Pause</button>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="execution-log" id="execution-log">
                <div class="welcome-message">
                    💬 <strong>Progress Blackboard</strong><br>
                    Real-time agent interactions and progress will appear here...<br>
                    <em>Start a task to see detailed execution steps</em>
                </div>
            </div>
        </div>
    </div>
    

    <!-- Load modular JavaScript files -->
    <script>console.log('Starting script loading...');</script>
    <script src="s1-websocket.js"></script>
    <script>console.log('s1-websocket.js loaded');</script>
    <script src="s2-rendering.js"></script>
    <script>console.log('s2-rendering.js loaded');</script>
    <script src="s3-execution.js"></script>
    <script>console.log('s3-execution.js loaded');</script>
    <script src="s4-interactions.js"></script>
    <script>console.log('s4-interactions.js loaded');</script>
    <script src="s5-app.js"></script>
    <script>console.log('s5-app.js loaded');</script>

    <!-- Removed fullscript.js - module verification script moved to archive -->
    <!-- <script src="jsscript.js"></script> -->

    
</body>
</html>
